[package]
name = "hey-martha"
version = "0.1.0"
description = "Hey Martha — on-device AI agent for macOS"
authors = ["you"]
edition = "2021"

[lib]
name = "hey_martha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["macos-private-api"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tauri-plugin-global-shortcut = "2"
chrono             = { version = "0.4", features = ["clock"] }
# HTTP client for downloading the model
reqwest = { version = "0.12", features = ["stream"] }
futures = "0.3"
# Local LLM Inference Engine (with Metal acceleration for Mac)
llama-cpp-2 = { version = "0.1.151", features = ["metal"] }
encoding_rs = "0.8"
pdf-extract = "0.12.0"
dotext = "0.1.1"
calamine = "0.36.0"
open = "5.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
eventkit-rs = { version = "0.5.6", default-features = false, features = ["reminders"] }
